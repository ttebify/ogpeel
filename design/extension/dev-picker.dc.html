<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ogpeel choose a framework</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0} a{color:#1A1714}</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; padding: 16px; background: #EFE6D8; color: #1A1714; font-family: Newsreader, serif; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 12px; padding-bottom: 8px; border-bottom: 4px double #1A1714">
    <a href="popup.dc.html" aria-label="Back" style="width: 44px; height: 44px; box-sizing: border-box; border: 1.5px solid #1A1714; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'IBM Plex Mono', monospace; font-size: 16px">←</a>
    <span style="font-size: 24px; font-weight: 600; line-height: 1">Make one like this</span>
  </div>

  <p style="margin: 12px 0 0; font-size: 16px; line-height: 1.35">Ogpeel writes a prompt for your coding agent, asking for link preview images in this style, with your own words and colours.</p>

  <div style="margin-top: 16px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 1px">YOUR SITE'S FRAMEWORK</div>
  <sc-if value="{{closed}}">
    <div style="margin-top: 8px; display: flex; align-items: stretch; border: 1.5px solid #1A1714">
      <div style="flex: 1; display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 40px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 1px"><span style="font-weight: 500">{{fw}}</span><span style="color: #5E554B">{{seen}}</span></div>
      <button onClick="{{open}}" aria-expanded="false" style="height: 40px; border: 0; border-left: 1.5px solid #1A1714; border-radius: 0; background: transparent; color: #1A1714; padding: 0 12px; font: 500 12px 'IBM Plex Mono', monospace; letter-spacing: 1px">CHANGE</button>
    </div>
    <div style="margin-top: 16px; position: relative; height: 136px; overflow: hidden; border: 1.5px solid #1A1714; background: #F7F1E6; padding: 12px; box-sizing: border-box; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.5; white-space: pre-line">{{prompt}}<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: linear-gradient(transparent, #F7F1E6)"></div></div>
  </sc-if>
  <sc-if value="{{opened}}">
    <input value="{{q}}" onInput="{{search}}" aria-label="Search frameworks" placeholder="Search" style="margin-top: 8px; height: 40px; box-sizing: border-box; border: 1.5px solid #1A1714; border-radius: 0; background: #F7F1E6; padding: 0 12px; font: 16px Newsreader, serif; color: #1A1714">
    <div style="margin-top: 8px; height: 252px; overflow-y: auto; border: 1.5px solid #1A1714; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
        <div>
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 1px; color: #5E554B">{{g.name}}</div>
          <div style="margin-top: 4px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px">
            <sc-for list="{{g.items}}" as="f" hint-placeholder-count="4">
              <button onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="height: 36px; border: 1.5px solid #1A1714; border-radius: 0; background: {{f.bg}}; color: {{f.fg}}; padding: 0 8px; text-align: left; font: 500 12px 'IBM Plex Mono', monospace; letter-spacing: 1px">{{f.label}}</button>
            </sc-for>
          </div>
        </div>
      </sc-for>
      <sc-if value="{{none}}"><div style="font-size: 16px">No matching framework. Try another search.</div></sc-if>
    </div>
  </sc-if>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 1px"><span>2 OF 2 FREE PROMPTS LEFT</span><a href="unlock.dc.html">UNLOCK →</a></div>
    <a href="copied.dc.html" style="height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 1.5px solid #1A1714; background: #1A1714; color: #EFE6D8; text-decoration: none; font: 500 13px 'IBM Plex Mono', monospace; letter-spacing: 1px">COPY PROMPT</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const cur = st.fw || 'NEXT.JS';
    const open = st.open === undefined ? true : st.open;
    const q = (st.q || '').toLowerCase();
    const all = [
      ['JAVASCRIPT', ['NEXT.JS', 'NUXT', 'SVELTEKIT', 'ASTRO', 'REACT ROUTER', 'TANSTACK START', 'GATSBY', 'VITE SPA']],
      ['STATIC', ['HUGO', 'ELEVENTY', 'JEKYLL', 'DOCUSAURUS', 'PLAIN HTML']],
      ['SERVER', ['LARAVEL', 'DJANGO', 'RAILS']],
      ['HOSTED', ['WORDPRESS', 'SHOPIFY', 'GHOST']]
    ];
    const groups = all.map(([name, list]) => ({
      name,
      items: list.filter((n) => n.toLowerCase().includes(q)).map((n) => ({
        label: n, on: n === cur ? 'true' : 'false',
        bg: n === cur ? '#1A1714' : 'transparent', fg: n === cur ? '#EFE6D8' : '#1A1714',
        pick: () => this.setState({ fw: n, open: false, q: '' })
      }))
    })).filter((g) => g.items.length);
    return {
      fw: cur, seen: cur === 'NEXT.JS' ? 'FROM THIS PAGE' : '',
      closed: !open, opened: open, q: st.q || '', groups, none: groups.length === 0,
      open: () => this.setState({ open: true }),
      search: (e) => this.setState({ q: e.target.value }),
      prompt: 'Build link preview images (Open Graph) for the pages of my ' + cur.toLowerCase() + ' site.\nSize: 1200 × 630, PNG.\nMatch the reference layout, but use my own colours, fonts and words…'
    };
  }
}
</script>
</body>
</html>
