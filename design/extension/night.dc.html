<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ogpeel popup night</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0} a{color:#EFE6D8}</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; padding: 16px; background: #1A1714; color: #EFE6D8; font-family: Newsreader, serif; display: flex; flex-direction: column">
  <div style="display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 8px; border-bottom: 4px double #EFE6D8">
    <span style="font-size: 24px; font-weight: 600">Ogpeel<span style="color: #E2593A">.</span></span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px">linear.app</span>
  </div>
  <div style="margin-top: 16px; border: 1.5px solid #EFE6D8; background: #24201C">
    <img src="/_blob/eebcf5f573a066a8d8e631baa9a4b9dc" alt="Share image from the Linear article" style="display: block; width: 100%; aspect-ratio: 1200 / 675">
    <div style="display: flex; justify-content: space-between; padding: 8px 12px; border-top: 1.5px solid #EFE6D8; font-family: 'IBM Plex Mono', monospace; font-size: 12px"><span style="padding: 2px 6px; background: #EFE6D8; color: #1A1714">LINK PREVIEW</span><span>1200 × 675 · PNG · 302 KB</span></div>
  </div>
  <div style="height: 44px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #EFE6D8; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 1px"><span>PREVIEW LINK</span><span>→</span></div>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
    <div style="height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 1.5px solid #EFE6D8; background: #E2593A; color: #1A1714; font: 500 13px 'IBM Plex Mono', monospace; letter-spacing: 1px; box-shadow: 3px 3px 0 #EFE6D8">↓ DOWNLOAD IMAGE</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1.5px solid #EFE6D8; font: 500 13px 'IBM Plex Mono', monospace; letter-spacing: 1px">
      <span style="height: 44px; display: flex; align-items: center; justify-content: center; border-right: 1.5px solid #EFE6D8">COPY IMAGE</span>
      <span style="height: 44px; display: flex; align-items: center; justify-content: center">COPY IMAGE LINK</span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #EFE6D8; padding-top: 4px; font-size: 16px; font-style: italic; height: 44px"><span>Make one like this for your site →</span><span style="font-style: normal">⚙</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
