<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ogpeel popup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0} a{color:#1A1714}</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; padding: 16px; background: #EFE6D8; color: #1A1714; font-family: Newsreader, serif; display: flex; flex-direction: column">
  <div style="display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 8px; border-bottom: 4px double #1A1714">
    <span style="font-size: 24px; font-weight: 600; letter-spacing: -.5px">Ogpeel<span style="color: #C8401E">.</span></span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px">blog.example.com</span>
  </div>

  <div style="margin-top: 16px; border: 1.5px solid #1A1714; background: #F7F1E6">
    <div style="aspect-ratio: 1200 / 630; background: #1A1714; color: #EFE6D8; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 1px; opacity: .7">SAMPLE</span>
      <span style="font-size: 24px; line-height: 1.1">How we cut our build time in half</span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-top: 1.5px solid #1A1714; font-family: 'IBM Plex Mono', monospace; font-size: 12px">
      <span style="padding: 2px 6px; background: #1A1714; color: #EFE6D8">LINK PREVIEW</span>
      <span>1200 × 630 · JPG · 148 KB</span>
    </div>
  </div>

  <a href="all-images.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1.5px solid #1A1714; text-decoration: none; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 1px">
    <span>2 MORE IMAGES ON THIS PAGE</span><span>→</span>
  </a>
  <a href="preview.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1.5px solid #1A1714; text-decoration: none; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 1px">
    <span>PREVIEW LINK</span><span>→</span>
  </a>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
    <a href="saved.dc.html" style="height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 1.5px solid #1A1714; background: #C8401E; color: #fff; text-decoration: none; font: 500 13px 'IBM Plex Mono', monospace; letter-spacing: 1px; box-shadow: 3px 3px 0 #1A1714">↓ DOWNLOAD IMAGE</a>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1.5px solid #1A1714">
      <button onClick="{{copyImg}}" style="height: 44px; border: 0; border-right: 1.5px solid #1A1714; border-radius: 0; background: {{imgBg}}; color: {{imgFg}}; font: 500 13px 'IBM Plex Mono', monospace; letter-spacing: 1px">{{imgLabel}}</button>
      <button onClick="{{copyLink}}" style="height: 44px; border: 0; border-radius: 0; background: {{linkBg}}; color: {{linkFg}}; font: 500 13px 'IBM Plex Mono', monospace; letter-spacing: 1px">{{linkLabel}}</button>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1.5px solid #1A1714; padding-top: 4px">
      <a href="dev.dc.html" style="height: 44px; display: flex; align-items: center; font-size: 16px; font-style: italic">Make one like this for your site →</a>
      <a href="settings.dc.html" aria-label="Settings" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1714" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const on = { bg: '#1A1714', fg: '#EFE6D8' }, off = { bg: 'transparent', fg: '#1A1714' };
    const i = s.img ? on : off, l = s.link ? on : off;
    return {
      imgLabel: s.img ? '✓ COPIED' : 'COPY IMAGE', imgBg: i.bg, imgFg: i.fg,
      linkLabel: s.link ? '✓ COPIED' : 'COPY IMAGE LINK', linkBg: l.bg, linkFg: l.fg,
      copyImg: () => this.setState({ img: true, link: false }),
      copyLink: () => this.setState({ link: true, img: false })
    };
  }
}
</script>
</body>
</html>
