<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ogpeel link preview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0} a{color:#1A1714}</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; padding: 16px; background: #EFE6D8; color: #1A1714; font-family: Newsreader, serif; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 12px; padding-bottom: 8px; border-bottom: 4px double #1A1714">
    <a href="popup.dc.html" aria-label="Back" style="width: 44px; height: 44px; box-sizing: border-box; border: 1.5px solid #1A1714; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'IBM Plex Mono', monospace; font-size: 16px">←</a>
    <span style="font-size: 24px; font-weight: 600">Link preview</span>
  </div>

  <div role="tablist" style="margin-top: 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1.5px solid #1A1714">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="height: 44px; border: 0; border-right: {{t.edge}}; border-radius: 0; background: {{t.bg}}; color: {{t.fg}}; font: 500 12px 'IBM Plex Mono', monospace; letter-spacing: 1px">{{t.label}}</button>
    </sc-for>
  </div>

  <div style="margin-top: 16px; padding: 16px; background: {{cardBg}}; border: 1.5px solid #1A1714; display: flex; flex-direction: column; gap: 8px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5E554B">{{where}}</span>
    <div style="border: 1px solid #C9BFAE; background: #fff; display: flex; flex-direction: {{dir}}">
      <div style="background: #1A1714; color: #EFE6D8; display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box; font-size: 12px; width: {{imgW}}; aspect-ratio: {{ratio}}; flex-shrink: 0">How we cut our build time…</div>
      <div style="padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5E554B">blog.example.com</span>
        <span style="font-size: 16px; font-weight: 600; line-height: 1.2">How we cut our build time in half</span>
      </div>
    </div>
  </div>

  <div style="margin-top: 16px; border-top: 1.5px solid #1A1714">
    <sc-for list="{{checks}}" as="c" hint-placeholder-count="3">
      <div style="display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #1A1714; font-size: 16px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; width: 16px; color: {{c.color}}">{{c.mark}}</span><span>{{c.text}}</span></div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = (this.state && this.state.tab) || 'X';
    const names = ['X', 'LINKEDIN', 'SLACK', 'WHATSAPP'];
    const look = {
      X: { where: 'In a post', dir: 'column', imgW: '100%', ratio: '1200 / 630' },
      LINKEDIN: { where: 'In the feed', dir: 'column', imgW: '100%', ratio: '1200 / 627' },
      SLACK: { where: 'Under a message', dir: 'column-reverse', imgW: '60%', ratio: '1200 / 630' },
      WHATSAPP: { where: 'In a chat', dir: 'row', imgW: '96px', ratio: '1 / 1' }
    }[cur];
    return {
      ...look,
      cardBg: '#F7F1E6',
      tabs: names.map((n, i) => ({
        label: n === 'WHATSAPP' ? 'WA' : n === 'LINKEDIN' ? 'IN' : n,
        on: n === cur ? 'true' : 'false',
        bg: n === cur ? '#1A1714' : 'transparent', fg: n === cur ? '#EFE6D8' : '#1A1714',
        edge: i < 3 ? '1.5px solid #1A1714' : '0',
        pick: () => this.setState({ tab: n })
      })),
      checks: [
        { mark: '✓', color: '#1A1714', text: 'Image is a size most apps expect' },
        { mark: '✓', color: '#1A1714', text: 'Link has a title and description' },
        { mark: '!', color: '#C8401E', text: 'No image description (alt text)' }
      ]
    };
  }
}
</script>
</body>
</html>
