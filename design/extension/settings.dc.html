<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ogpeel settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0} a{color:#1A1714}</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; padding: 16px; background: #EFE6D8; color: #1A1714; font-family: Newsreader, serif; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 12px; padding-bottom: 8px; border-bottom: 4px double #1A1714">
    <a href="popup.dc.html" aria-label="Back" style="width: 44px; height: 44px; box-sizing: border-box; border: 1.5px solid #1A1714; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'IBM Plex Mono', monospace; font-size: 16px">←</a>
    <span style="font-size: 24px; font-weight: 600">Settings</span>
  </div>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
    <div style="padding: 12px 0; border-bottom: 1.5px solid #1A1714; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 16px">{{g.label}}</span>
      <div style="display: grid; grid-template-columns: repeat({{g.n}}, minmax(0, 1fr)); border: 1.5px solid #1A1714">
        <sc-for list="{{g.opts}}" as="o" hint-placeholder-count="2">
          <button onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="height: 36px; border: 0; border-right: {{o.r}}; border-radius: 0; background: {{o.bg}}; color: {{o.fg}}; font: 500 12px 'IBM Plex Mono', monospace; letter-spacing: 1px">{{o.label}}</button>
        </sc-for>
      </div>
    </div>
  </sc-for>

  <div style="padding: 12px 0; border-bottom: 1.5px solid #1A1714; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px">Developer prompts</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5E554B">FREE · 1 OF 2 LEFT</span></div>
    <a href="key.dc.html" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 1px; height: 44px; display: flex; align-items: center">ENTER KEY →</a>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column">
    <a href="landing.dc.html#coffee" style="height: 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1A1714; text-decoration: none; font-size: 16px"><span>Buy me a coffee</span><span>↗</span></a>
    <a href="restore.dc.html" style="height: 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1A1714; text-decoration: none; font-size: 16px"><span>Lost your key?</span><span>↗</span></a>
    <a href="privacy.dc.html" style="height: 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1A1714; text-decoration: none; font-size: 16px"><span>Privacy</span><span>↗</span></a>
    <span style="margin-top: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5E554B">OGPEEL 1.0.0</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const s = Object.assign({ name: 'PAGE TITLE', look: 'AUTO', src: 'ON' }, this.state || {});
    const mk = (key, label, opts) => ({
      label, n: opts.length,
      opts: opts.map((o, i) => ({
        label: o, on: s[key] === o ? 'true' : 'false',
        bg: s[key] === o ? '#1A1714' : 'transparent', fg: s[key] === o ? '#EFE6D8' : '#1A1714',
        r: i < opts.length - 1 ? '1.5px solid #1A1714' : '0',
        pick: () => this.setState({ [key]: o })
      }))
    });
    return { groups: [
      mk('name', 'Name saved files after', ['PAGE TITLE', 'ORIGINAL']),
      mk('look', 'Look', ['AUTO', 'DAY', 'NIGHT']),
      mk('src', 'Keep the page address with each copy', ['ON', 'OFF'])
    ] };
  }
}
</script>
</body>
</html>
